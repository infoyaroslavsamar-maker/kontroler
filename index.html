 if(f.id==='freq'){const type=f.querySelector('[name=rt]:checked').value,date=+$('#rd').value;if(!date)return toast('Немає доступних дат');const date2=type==='swap'?+$('#rd2').value:null;if(type==='swap'&&!date2)return toast('Виберіть зміну колеги');
  if(await api('swap_request',{p_type:type,p_colleague:$('#rs').value,p_date1:dIn(date),p_date2:date2?dIn(date2):null,p_note:val('rn')},'Надіслано колезі на підтвердження'))formReq();return}
 if(f.id==='fout'){const a=+new Date($('#of').value),b=+new Date($('#ot').value);if(!a||!b||b<=a)return toast('Перевірте час: «з\'явилося» має бути пізніше');
  if(await api('outage_add',{p_from:new Date(a).toISOString(),p_to:new Date(b).toISOString()},`Простій ${dur(b-a)} записано`))close();return}
 if(f.id==='fgoal'){const q=Math.floor(+$('#gq').value),uu=$('#gu').value,ff=$('#gf').value;if(!(q>0)||!uu||!ff)return toast('Заповніть усі поля');const gp=$('#gp').value;
  return api('goal_add',{p_model:gp==='*'?null:MID[gp],p_qty:q,p_from:ff,p_until:uu},'Ціль поставлено')}
 if(f.classList.contains('mrow')){const o=parts[+f.dataset.i],nw=f.querySelector('input').value.trim();if(nw===o)return;return api('model_rename',{p_id:MID[o],p_name:nw},`Перейменовано: ${o} → ${nw}`)}
 if(f.id==='fmadd')return api('model_add',{p_name:val('pn')},'Модель додано');
 if(f.id==='fap'){const id=f.dataset.id;if(await api('set_machine',{p_machine:id,p_name:val('apn'),p_model:f.querySelector('[name=apt]:checked').value},'Апарат збережено'))openBox(id);return}
 if(f.id==='fho'){const s=f.dataset.s;if(!$('#co1').checked||!$('#co2').checked)return toast('Підтвердіть обидва пункти');const to=f.querySelector('[name=to]:checked')?.value;if(!to)return toast('Виберіть, кому передати');
  if(await api('handover_start',{p_sector:s,p_to:to,p_note:val('hn')},`Передано. ${fn(to)} має увійти й підтвердити`))close();return}
 if(f.id==='fper'){const id=f.dataset.id,role=f.querySelector('[name=pr]:checked').value,grp=role==='worker'?+$('#pg').value:null,name=val('pnm'),pinv=val('ppin');
  if(!name)return toast('Вкажіть ім\'я');
  if(!id){if(!(await api('person_add',{p_name:name,p_role:role,p_grp:grp,p_pin:pinv},'Користувача додано')))return}
  else{if(!(await api('person_update',{p_id:id,p_name:name,p_role:role,p_grp:grp,p_active:$('#pact').checked},'Збережено')))return;if(pinv&&!(await api('person_pin',{p_id:id,p_pin:pinv},'PIN змінено')))return}
  close();return}
 if(f.id==='fset'){const a=$('#ranc').value;if(!a)return toast('Вкажіть дату');return api('setting_set',{p_key:'rotation_anchor',p_val:a},'Графік збережено')}
 if(f.id==='fmypin'){if(await api('change_my_pin',{p_old:val('op'),p_new:val('np')},'PIN змінено'))close();return}
});
setInterval(()=>{if(TOKEN&&me&&$('#ov').hidden&&!document.hidden&&!document.activeElement?.closest?.('input,textarea,select'))load().catch(()=>{})},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOKEN&&me)load().catch(()=>{})});
if(CFG.url.startsWith('__')){$('#main').innerHTML='<div class="card"><h2>Програму ще не підключено до бази</h2><p>Вставте адресу та ключ Supabase у файл index.html (рядок CFG).</p></div>'}
else if(TOKEN){busy(true);load().catch(e=>{toast(e.message);if(!me){saveTok(null);loadPeople()}}).finally(()=>busy(false))}else loadPeople();

}
</script>
